services:
  # 1. PostgreSQL Database
  - type: pgo
    name: smartstock-db
    plan: starter
    version: 15

  # 2. FastAPI Backend
  - type: web
    name: smartstock-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: ohio
    plan: starter
    healthCheckPath: /health
    disk:
      name: model_data
      mountPath: /app/data/models
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartstock-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SENTRY_DSN
        sync: false

  # 3. React Frontend
  - type: web
    name: smartstock-dashboard
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    region: ohio
    plan: starter
    envVars:
      - key: VITE_API_URL
        value: https://smartstock-api.onrender.com
