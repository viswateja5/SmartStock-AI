services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: smartstock-api
    runtime: python
    region: ohio
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 2. React Frontend Static Site (Zero-Cost, High-Performance CDN)
  - type: static
    name: smartstock-dashboard
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://smartstock-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
